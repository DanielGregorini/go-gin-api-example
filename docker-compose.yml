
services:
  api:
    build:
      context: ./api_go
      dockerfile: Dockerfile
    container_name: api_go
    ports:
      - "8080:8080"
    env_file:
      - ./api_go/.env
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:15
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: api_go
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
